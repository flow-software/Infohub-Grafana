apiVersion: 1

# Stand-alone dev/CI datasource, used by docker-compose.yaml alone (the e2e
# tests). FLOW_URL and FLOW_API_TOKEN come from the environment; unset, the
# datasource exists but cannot connect. Day-to-day development uses the
# Timebase dev Grafana instead (see README).
datasources:
  - name: 'Flow'
    type: 'flowsoftware-infohub-datasource'
    uid: 'flow-dev'
    access: proxy
    isDefault: false
    orgId: 1
    version: 1
    editable: true
    url: '${FLOW_URL}'
    jsonData:
      defaultCalendarId: 0
    secureJsonData:
      token: '${FLOW_API_TOKEN}'
