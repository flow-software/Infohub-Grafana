# Runs this plugin in the Timebase plugin's dev Grafana (http://localhost:3000)
# instead of a second Grafana. Layer it on that repo's compose files, from
# this repo's folder:
#
#   docker compose -p timebase-i3x-datasource `
#     -f ../../Timebase-Grafana/Historian/docker-compose.yaml `
#     -f ../../Timebase-Grafana/Historian/docker-compose.timebase.yaml `
#     -f docker-compose.timebase-grafana.yaml up -d
#
# TIMEBASE_CLIENT_SECRET must be set for that command, as for the Timebase
# stack alone. Relative paths resolve from the first file's folder.
#
# Grafana's data lives in the tbi3x-grafana-data volume, so dashboards, alert
# rules and the Flow datasource survive the container being recreated.
services:
  grafana:
    volumes:
      - tbi3x-grafana-data:/var/lib/grafana
      - ../../Infohub-Grafana/Flow/dist:/var/lib/grafana/plugins/flowsoftware-flow-datasource
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: flowsoftware-timebasei3x-datasource,flowsoftware-flow-datasource
      GF_LOG_FILTERS: plugin.flowsoftware-timebasei3x-datasource:debug,plugin.flowsoftware-flow-datasource:debug
    # Flow Bootstrap on the Docker host.
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  tbi3x-grafana-data:
    external: true
